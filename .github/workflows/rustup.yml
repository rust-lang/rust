name: CI with the cg_gcc distributed by rustup

on:
  # FIXME: remove once this workflow passes, so that it only runs nightly.
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Enable backtraces for easier debugging
  RUST_BACKTRACE: 1
  # For the run-make tests.
  LLVM_BIN_DIR: /usr/bin

jobs:
  build:
    runs-on: ubuntu-24.04
    # Above 3 times the longest job, so that a hang cannot run until GitHub's 6-hour limit.
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        commands: [
          "--std-tests --alloc-tests",
          # FIXME: re-enable asm tests when GCC can emit in the right syntax.
          # "--asm-tests",
          "--test-libcore",
          "--extended-rand-tests",
          "--extended-regex-example-tests --test-libcore-doctests",
          "--extended-regex-tests",
          "--test-successful-rustc --nb-parts 2 --current-part 0",
          "--test-successful-rustc --nb-parts 2 --current-part 1",
          "--librsvg-tests",
          "--projects --nb-parts 3 --current-part 0",
          "--projects --nb-parts 3 --current-part 1",
          "--projects --nb-parts 3 --current-part 2",
          "--gcc-asm-tests --test-release-libcore",
        ]
        # The tests that don't depend on the test command only run in the fastest job.
        include:
          - commands: "--extended-rand-tests"
            run_cargo_tests: true

    steps:
    - uses: actions/checkout@v4

    # `rustup show` installs from rust-toolchain.toml
    - name: Setup rust toolchain
      run: rustup show

    - name: Use the cg_gcc distributed by rustup
      uses: ./.github/actions/rustup-cg-gcc

    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2

    - name: Add apt mirrors
      uses: ./.github/actions/apt-mirrors

    - name: Install packages
      # `llvm-14-tools` is needed to install the `FileCheck` binary which is used for asm tests.
      timeout-minutes: 20
      run: |
        sudo apt-get update
        sudo apt-get install ninja-build ripgrep llvm-14-tools llvm

    - name: Install the libraries needed to build librsvg
      if: ${{ contains(matrix.commands, '--librsvg-tests') }}
      timeout-minutes: 20
      run: sudo apt-get install libcairo2-dev libpango1.0-dev libfontconfig1-dev libfreetype-dev libharfbuzz-dev libxml2-dev libglib2.0-dev

    - name: Set env
      run: |
        echo "workspace="$GITHUB_WORKSPACE >> $GITHUB_ENV

    - name: Prepare
      if: ${{ matrix.run_cargo_tests }}
      run: ./y.sh prepare --only-libcore

    - name: Build
      if: ${{ matrix.run_cargo_tests }}
      run: |
        ./y.sh build --sysroot
        ./y.sh test --cargo-tests
        CARGO_TEST_FLAGS="-Zmir-preserve-ub" ./y.sh test --cargo-tests -- mir_preserve_ub_empty_switch
        CARGO_TEST_FLAGS="-Ctarget-feature=+cmpxchg16b" ./y.sh test --cargo-tests -- atomic_u128

    - name: Run y.sh cargo build
      if: ${{ matrix.run_cargo_tests }}
      run: |
        CARGO_PROFILE_DEV_LTO=no ./y.sh cargo build --manifest-path tests/hello-world/Cargo.toml

    - name: Clean
      if: ${{ matrix.run_cargo_tests }}
      run: |
        ./y.sh clean all

    - name: Remove rustc-dev
      uses: ./.github/actions/remove-rustc-dev

    - name: Prepare dependencies
      run: |
        git config --global user.email "user@example.com"
        git config --global user.name "User"
        ./y.sh prepare

    - name: Run tests
      run: |
        ./y.sh test --release --clean --build-sysroot --no-builtins-tests ${{ matrix.commands }}

  release:
    runs-on: ubuntu-24.04
    # Above 3 times the longest job, so that a hang cannot run until GitHub's 6-hour limit.
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        commands: [
          "--test-successful-rustc --nb-parts 2 --current-part 0",
          "--test-successful-rustc --nb-parts 2 --current-part 1",
        ]

    steps:
    - uses: actions/checkout@v4

    # `rustup show` installs from rust-toolchain.toml
    - name: Setup rust toolchain
      run: rustup show

    - name: Use the cg_gcc distributed by rustup
      uses: ./.github/actions/rustup-cg-gcc

    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2

    - name: Add apt mirrors
      uses: ./.github/actions/apt-mirrors

    - name: Install packages
      # `llvm-14-tools` is needed to install the `FileCheck` binary which is used for run-make tests.
      timeout-minutes: 20
      run: sudo apt-get install ninja-build ripgrep llvm-14-tools llvm

    - name: Set env
      run: |
        echo "workspace="$GITHUB_WORKSPACE >> $GITHUB_ENV

    - name: Build
      run: |
        ./y.sh prepare --only-libcore
        ./y.sh build --sysroot --release --release-sysroot
        ./y.sh test --cargo-tests
        ./y.sh clean all

    - name: Remove rustc-dev
      uses: ./.github/actions/remove-rustc-dev

    - name: Prepare dependencies
      run: |
        git config --global user.email "user@example.com"
        git config --global user.name "User"
        ./y.sh prepare

    - name: Add more failing tests (some panic and debuginfo tests fail)
      run: cat tests/failing-lto-tests.txt >> tests/failing-ui-tests.txt

    - name: Run tests
      run: |
        # FIXME(antoyo): we cannot enable LTO for stdarch tests currently because of some failing LTO tests using proc-macros.
        CG_RUSTFLAGS="-Cembed-bitcode=yes" ./y.sh test --release --clean --release-sysroot --build-sysroot --keep-lto-tests ${{ matrix.commands }}

    - name: LTO test
      run: |
        CHANNEL="release" ./y.sh cargo build --release --manifest-path tests/hello-world/Cargo.toml
        call_found=$(objdump -dj .text tests/hello-world/target/release/hello_world | grep -c "call .*mylib.*my_func" ) ||:
        if [ $call_found -gt 0 ]; then
          echo "ERROR: call my_func found in asm"
          echo "Test is done with LTO enabled, hence inlining should occur across crates"
          exit 1
        fi

    - name: Cross-language LTO test
      run: |
        pushd tests/cross_lang_lto
        gcc -c -flto add.c -masm=intel -fPIC -O3
        ar rcs libadd.a add.o
        popd

        CHANNEL="release" CG_RUSTFLAGS="-L native=. -Clinker-plugin-lto -Clinker=gcc" ./y.sh cargo build --release --manifest-path tests/cross_lang_lto/Cargo.toml
        call_found=$(objdump -dj .text tests/cross_lang_lto/target/release/cross_lang_lto | grep -c "call .*my_add" ) ||:
        if [ $call_found -gt 0 ]; then
          echo "ERROR: call my_add found in asm"
          echo "Test is done with cross-language LTO enabled, hence inlining should occur across object files"
          exit 1
        fi

  stdarch:
    runs-on: ubuntu-24.04
    # Above 3 times the longest job, so that a hang cannot run until GitHub's 6-hour limit.
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        cargo_runner: [
          "sde -cpuid-in /home/runner/work/rustc_codegen_gcc/rustc_codegen_gcc/tests/cpuid.def -rtm_mode full --",
          "",
        ]

    steps:
    - uses: actions/checkout@v4

    # `rustup show` installs from rust-toolchain.toml
    - name: Setup rust toolchain
      run: rustup show

    # The stdarch-gen-common tests run rustfmt.
    - name: Install rustfmt
      run: rustup component add rustfmt

    - name: Use the cg_gcc distributed by rustup
      uses: ./.github/actions/rustup-cg-gcc

    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2

    - name: Add apt mirrors
      uses: ./.github/actions/apt-mirrors

    - name: Install packages
      timeout-minutes: 20
      run: sudo apt-get install ninja-build ripgrep

    # FIXME: remove when we have binutils version 2.43 in the repo.
    - name: Install more recent binutils
      # Without a limit, an unreachable mirror hangs the job until GitHub's 6-hour timeout.
      timeout-minutes: 20
      run: |
        echo "deb mirror+file:/etc/apt/apt-mirrors.txt plucky main universe" | sudo tee /etc/apt/sources.list.d/plucky-copies.list
        sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=30
        sudo apt-get install binutils
        installed="$(dpkg-query --showformat='${Version}' --show binutils)"
        echo "Installed binutils: $installed"
        if dpkg --compare-versions "$installed" lt "2.44"; then
            echo "::error::binutils upgrade failed (got $installed, need >= 2.44); the apt fetch probably failed"
            exit 1
        fi

    - name: Install Intel Software Development Emulator
      if: ${{ matrix.cargo_runner }}
      run: |
          mkdir intel-sde
          cd intel-sde
          version=10.8.0-2026-03-15
          dir=sde-external-$version-lin
          file=$dir.tar.xz
          wget http://ci-mirrors.rust-lang.org/$file
          tar xvf $file
          sudo mkdir /usr/share/intel-sde
          sudo cp -r $dir/* /usr/share/intel-sde
          sudo ln -s /usr/share/intel-sde/sde /usr/bin/sde
          sudo ln -s /usr/share/intel-sde/sde64 /usr/bin/sde64

    - name: Build
      run: |
        ./y.sh prepare --only-libcore
        ./y.sh build --sysroot --release --release-sysroot

    - name: Clean
      if: ${{ !matrix.cargo_runner }}
      run: |
        ./y.sh clean all

    - name: Prepare dependencies
      run: |
        git config --global user.email "user@example.com"
        git config --global user.name "User"
        ./y.sh prepare

    - name: Run tests
      if: ${{ !matrix.cargo_runner }}
      run: |
        ./y.sh test --release --clean --release-sysroot --build-sysroot --mini-tests --std-tests --test-libcore
        ./y.sh test --cargo-tests

    - name: Remove rustc-dev
      uses: ./.github/actions/remove-rustc-dev

    - name: Run stdarch tests
      if: ${{ !matrix.cargo_runner }}
      run: |
        # FIXME: remove --skip test_tile_ and --skip --skip test__tile when it's implemented.
        # FIXME: remove --skip test_mm_srav_epi64 when it's fixed upstream.
        ./y.sh test --release --stdarch-tests -- --skip test_tile_ --skip test__tile --skip test_mm_srav_epi64

    - name: Run stdarch tests
      if: ${{ matrix.cargo_runner }}
      run: |
        # FIXME: these tests fail when the sysroot is compiled with LTO because of a missing symbol in proc-macro.
        # FIXME: remove --skip test_tile_ and --skip --skip test__tile when it's implemented.
        # FIXME: remove --skip test_mm_srav_epi64 when it's fixed upstream.
        STDARCH_TEST_SKIP_FUNCTION="xsave,xsaveopt,xsave64,xsaveopt64" STDARCH_TEST_EVERYTHING=1 CHANNEL=release CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER="${{ matrix.cargo_runner }}" TARGET=x86_64-unknown-linux-gnu CG_RUSTFLAGS="-Ainternal_features" ./y.sh cargo test --manifest-path build/build_sysroot/sysroot_src/library/stdarch/Cargo.toml -- --skip rtm --skip tbm --skip sse4a --skip test_tile_ --skip test__tile --skip test_mm_srav_epi64

  failures:
    runs-on: ubuntu-24.04
    # Above 3 times the longest job, so that a hang cannot run until GitHub's 6-hour limit.
    timeout-minutes: 90

    steps:
    - uses: actions/checkout@v4

    # `rustup show` installs from rust-toolchain.toml
    - name: Setup rust toolchain
      run: rustup show

    - name: Use the cg_gcc distributed by rustup
      uses: ./.github/actions/rustup-cg-gcc

    - name: Remove rustc-dev
      uses: ./.github/actions/remove-rustc-dev

    - name: Setup rust cache
      uses: Swatinem/rust-cache@v2

    - name: Add apt mirrors
      uses: ./.github/actions/apt-mirrors

    - name: Install packages
      timeout-minutes: 20
      run: sudo apt-get install ninja-build ripgrep

    - name: Set env
      run: |
        echo "workspace="$GITHUB_WORKSPACE >> $GITHUB_ENV

    - name: Prepare dependencies
      run: |
        git config --global user.email "user@example.com"
        git config --global user.name "User"
        ./y.sh prepare

    - name: Run tests
      run: |
        # Without this, `tee` masks the exit status of `y.sh test`.
        set -o pipefail
        status=0
        ./y.sh test --release --clean --build-sysroot --test-failing-rustc 2>&1 | tee output_log || status=$?
        # This suite runs the tests known to fail, so only a build system error must fail the job.
        if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
          exit "$status"
        fi
        rg --text "test result" output_log >> $GITHUB_STEP_SUMMARY

    - name: Run failing ui pattern tests for ICE
      run: |
        # Without this, `tee` masks the exit status of `y.sh test`.
        set -o pipefail
        status=0
        ./y.sh test --release --test-failing-ui-pattern-tests 2>&1 | tee output_log_ui || status=$?
        # This suite runs tests that fail, so only a build system error must fail the job here.
        if [ "$status" -ne 0 ] && [ "$status" -ne 2 ]; then
          exit "$status"
        fi
        if grep -q "the compiler unexpectedly panicked" output_log_ui; then
          echo "Error: 'the compiler unexpectedly panicked' found in output logs. CI Error!!"
          exit 1
        fi
