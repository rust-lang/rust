# Workflow that runs after a merge to the default branch.
# It performs two things:
# 1) Analyses changes in test executions and posts the result to the merged PR.
# 2) Performs a cargo publish on crates published from the `rust-lang/rust` repository, and if a
#    publish happened, post the result to the merged PR.

name: Post merge workflow

on:
  push:
    branches:
      - main

jobs:
  analysis:
    runs-on: ubuntu-26.04
    if: github.repository == 'rust-lang/rust'
    permissions:
      pull-requests: write  # For sending a PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Make sure that we have enough commits to find the parent merge commit.
          # Since all merges should be through merge commits, fetching two commits
          # should be enough to get the parent bors merge commit.
          fetch-depth: 2
          persist-credentials: false
      - name: Perform analysis and send PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Give GitHub some time to propagate the information that the PR was merged
          sleep 60

          # Get closest bors merge commit
          PARENT_COMMIT=`git rev-list --author='bors@rust-lang.org' --author='122020455+rust-bors\[bot\]@users.noreply.github.com' -n1 --first-parent HEAD^1`
          echo "Parent: ${PARENT_COMMIT}"

          # Find PR for the current commit
          HEAD_PR=`gh pr list --search "${{ github.sha }}" --state merged --json number --jq '.[0].number'`
          if [ -z "${HEAD_PR}" ]; then
            echo "PR for commit SHA ${{ github.sha }} not found, exiting"
            exit 1
          fi
          echo "HEAD: ${{ github.sha }} (#${HEAD_PR})"

          cd src/ci/citool

          printf "<details>\n<summary>What is this?</summary>\n" >> output.log
          printf "This is an experimental post-merge analysis report that shows differences in test outcomes between the merged PR and its parent PR.\n" >> output.log
          printf "</details>\n\n" >> output.log

          cargo run --locked --release post-merge-report ${PARENT_COMMIT} ${{ github.sha }} >> output.log

          cat output.log

          gh pr comment ${HEAD_PR} -F output.log
  publish:
    runs-on: ubuntu-26.04
    if: github.repository == 'rust-lang/rust'
    environment: publish-crates-io
    permissions:
      id-token: write # For OIDC crates.io publishing
      pull-requests: write  # For sending a PR comment
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - run: |
          set -eux -o pipefail

          # Give GitHub some time to propagate the information that the PR was merged
          sleep 60

          # Find PR for the current commit
          HEAD_PR=$(gh pr list --search "${GITHUB_SHA}" --state merged --json number --jq '.[0].number')
          if [ -z "${HEAD_PR}" ]; then
            echo "PR for commit SHA ${GITHUB_SHA} not found, exiting"
            exit 1
          fi
          echo "HEAD: ${GITHUB_SHA} (#${HEAD_PR})"

          git submodule update --init library/backtrace
          cd library/backtrace

          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "backtrace") | .version')
          CRATE=backtrace

          # Check if the version exists on crates.io already with a HEAD request to the CDN
          code=$(curl --head --silent -o /dev/null --write-out '%{http_code}' "https://static.crates.io/crates/${CRATE}/${CRATE}-${VERSION}.crate")

          # If the crate version already exists, then there is nothing left to do
          if [[ $code == 200 ]]; then
            exit 0
          fi

          set +e
          cargo publish --locked &> ${RUNNER_TEMP}/cargo-log.txt
          STATUS=$?
          set -e

          if [[ ${STATUS} == 0 ]]; then
            echo "backtrace \`${VERSION}\` published to crates.io" > comment.txt
          else
            echo "backtrace \`${VERSION}\` could not be published to crates.io" > comment.txt
            printf "<details>\n<summary>Cargo publish log</summary>\n\n" >> comment.txt
            printf '```\n' >> comment.txt
            cat "${RUNNER_TEMP}/cargo-log.txt" >> comment.txt  
            printf '\n```\n' >> comment.txt
            printf "</details>\n\n" >> comment.txt
          fi

          gh pr comment "${HEAD_PR}" -F comment.txt
          exit "${STATUS}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_SHA: ${{ github.sha }}
