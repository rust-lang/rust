# See bootstrap.example.toml for documentation of available options
#
profile = "compiler"  # Includes one of the default files in src/bootstrap/defaults
change-id = 148671
[llvm]
# Disable downloading pre-built LLVM
download-ci-llvm = false
# (Optional) Optimize the LLVM build itself
optimize = false
# Must include host backends too (AArch64 for Apple Silicon, X86 for x86_64 hosts)
targets = "AArch64;X86;Patmos"
experimental-targets = "Patmos"
link-shared = false

[target.patmos-unknown-none]
# Bandaid fix to resolve the compiler_builtin soft-float helpers (__adddf3 et. al.) to make Platin actually resolve them,
# because otherwise Platin will complain about "__any__" being unresolvable, so this makes sure it is linked correctly.
rustflags = ["-C", "codegen-units=1", "-C", "embed-bitcode=yes"]

