[package]
name = "rustc_serialize"
version = "0.0.0"
edition = "2024"

[dependencies]
# tidy-alphabetical-start
hashbrown = { git = "https://github.com/Zoxc/hashbrown.git", branch = "linear-probes", default-features = false }
indexmap = "2.0.0"
rustc_hashes = { path = "../rustc_hashes" }
smallvec = { version = "1.8.1", features = ["union", "may_dangle"] }
thin-vec = "0.2.19"
# tidy-alphabetical-end

[dev-dependencies]
# tidy-alphabetical-start
rustc_macros = { path = "../rustc_macros" }
tempfile = "3.2"
# tidy-alphabetical-end
