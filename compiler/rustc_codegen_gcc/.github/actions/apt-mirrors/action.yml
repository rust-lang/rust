name: Add apt mirrors
description: >
  Lets apt fail over to mirrors run by other organizations, since the Ubuntu ones can stall
  (actions/runner-images#14594, #14823).

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        # Appended after the runner's azure.archive, archive and security mirrors.
        printf '%s\tpriority:%s\n' \
          https://mirrors.edge.kernel.org/ubuntu/ 4 \
          https://mirrors.mit.edu/ubuntu/ 5 \
          https://mirrors.ocf.berkeley.edu/ubuntu/ 6 \
          | sudo tee -a /etc/apt/apt-mirrors.txt
        # Tried last: apt never leaves a mirror that is slow but not stalled, which azure.archive
        # often is (actions/runner-images#14823).
        sudo sed -i 's#^\(http://azure\.archive\.ubuntu\.com/ubuntu/\s\+priority:\)[0-9]\+#\17#' \
          /etc/apt/apt-mirrors.txt
