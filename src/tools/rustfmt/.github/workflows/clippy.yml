name: clippy
on:
  merge_group:
  pull_request:

permissions:
  contents: read

jobs:
  check_clippy_configs:
    runs-on: ubuntu-latest
    name: check clippy configs
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > rustup-init.sh
          sh rustup-init.sh -y --default-toolchain none
      - name: Check clippy configs all match
        run: cargo run --locked --manifest-path ci/Cargo.toml -- clippy-config-check


  run_clippy:
    runs-on: ubuntu-latest
    name: clippy ${{ matrix.package }}
    strategy:
      fail-fast: false
      matrix:
        package:
          - . # rustfmt
          - check_diff
          - ci
          - config_proc_macro
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install rustup
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs > rustup-init.sh
          sh rustup-init.sh -y --default-toolchain none
      - name: clippy
        run: cargo clippy --locked --manifest-path ${{ matrix.package }}/Cargo.toml

