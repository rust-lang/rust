[package]
description = "Debugger for Rust MIR."
license = "MIT OR Apache-2.0"
name = "priroda"
repository = "https://github.com/rust-lang/miri"
version = "0.1.0"
edition = "2024"

[workspace]

[[bin]]
name = "priroda"
path = "src/main.rs"
test = false         # Disable unit tests to avoid errors with --bless
doctest = false      # and no doc tests

[[test]]
name = "cli"
harness = false

[dependencies]
emmy_dap_types = "0.2.0"
miri = { path = ".." }

[package.metadata.rust-analyzer]
rustc_private = true

# Same lint policy as miri/src/lib.rs.
[lints.rust]
rust_2018_idioms = "warn"

[lints.clippy]
as_conversions = "warn"
manual_let_else = "warn"

[dev-dependencies]
ui_test = "0.30.2"
regex = "1.5.5"
