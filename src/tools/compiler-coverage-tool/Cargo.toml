[package]
name = "compiler-coverage-tool"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "compiler-coverage-tool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
askama = "0.16.0"
clap = { version = "4", features = ["derive"] }
rustc-demangle = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
